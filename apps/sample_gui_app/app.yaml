id: sample_gui_app
name: GUIサンプルアプリ

display:
  icon: icon.svg
  short_description: 小さな画面を表示するデモアプリです。
  categories:
    - 業務デモ
    - 画面操作

detail:
  description: >
    Python標準機能で小さな画面を表示し、ToolHubからGUIアプリを起動できることを確認するためのサンプルです。
  use_cases:
    - GUIアプリの起動確認をしたい
    - 新しい画面アプリの雛形を確認したい
  inputs:
    - なし
  outputs:
    - デモ画面
  notes:
    - 画面を閉じるとアプリは終了します。

search:
  keywords:
    - GUI
    - 画面
    - サンプル
    - デモ
  examples:
    - 画面アプリを起動したい
    - GUIのサンプルを見たい

run:
  runner: python
  entry: main.py
  mode: gui

admin:
  version: 1.0.0
  owner: admin
  requirements: requirements.txt
  log_dir: logs

