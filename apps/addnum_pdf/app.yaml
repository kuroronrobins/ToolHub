id: addnum_pdf
name: AddNum PDF

display:
  icon: icon.png
  icon_fallback: icon.svg
  short_description: "PDFのページ番号付与を行う業務向けアプリです。"
  categories:
    - "文書処理"
    - "PDF編集"
    - "業務支援"

detail:
  description: >
    このアプリは、PDFファイルにページ番号を付与するための補助ツールです。文書管理や配布資料の整形、印刷前の確認作業などで、ページの識別を分かりやすくする用途に向いています。
  use_cases:
    - "配布用PDFへのページ番号追加"
    - "社内文書の整理と参照性向上"
    - "印刷前のページ確認"
  inputs:
    - "PDFファイル"
    - "ページ番号の付与条件"
    - "処理対象の指定"
  outputs:
    - "ページ番号が付与されたPDF"
    - "処理結果の表示"
  notes:
    - "入力PDFの内容やレイアウトによっては、番号の位置や見え方を事前確認してください。"
    - "元ファイルを上書きしない運用を推奨します。"

search:
  keywords:
    - PDF
    - "ページ番号"
    - "文書処理"
    - "業務支援"
    - AddNum PDF
  examples:
    - "PDFにページ番号を付けて配布用に整える"
    - "会議資料の各ページに通し番号を追加する"

run:
  runner: exe
  entry: bin/addnum_pdf/addnum_pdf.exe
  mode: gui

admin:
  version: 0.1.0
  owner: admin
  requirements: requirements.txt
  log_dir: logs

runtime:
  distribution_mode: frozen_folder
  app_env: null
  required_runtime: null
  requirements_lock: requirements.lock

