id: run_xcgate_upload
name: Run Xcgate Upload

display:
  icon: icon.png
  icon_fallback: icon.svg
  short_description: "XC-Gateへのチェックシート登録を自動化する業務用アプリです。"
  categories:
    - "業務自動化"
    - "画面操作支援"
    - "登録作業支援"

detail:
  description: >
    Playwrightを使ってXC-Gate（社内システム）のチェックシート登録を支援するスクリプト集です。Excelファイルを順次アップロードし、手動でのログイン後に登録処理を進められます。複数ファイルの一括処理、成功・失敗の分岐、詳細ログの出力に対応しています。
  use_cases:
    - "XC-Gateへのチェックシート登録をまとめて実行したいとき"
    - "Excelファイルを1件ずつ順番に登録したいとき"
    - "手動ログイン後の登録操作を自動化したいとき"
  inputs:
    - "登録対象のExcelファイル群"
    - "実行設定ファイル"
    - "ブラウザでの手動ログイン完了状態"
  outputs:
    - "XC-Gateへの登録結果"
    - "実行ログ"
    - "スクリーンショットや補助ログ"
  notes:
    - "社内システムへのアクセス権限が必要です。"
    - "実行前に対象ファイルと設定内容を確認してください。"
    - "ブラウザ操作に依存するため、画面状態の変化で挙動が変わる場合があります。"

search:
  keywords:
    - XC-Gate
    - "チェックシート"
    - "自動アップロード"
    - Playwright
    - Excel
    - "一括登録"
    - "画面操作"
  examples:
    - "XC-Gateのチェックシートを複数のExcelファイルから順次登録する。"

run:
  runner: exe
  entry: bin/run_xcgate_upload/run_xcgate_upload.exe
  mode: cli

admin:
  version: 0.1.0
  owner: admin
  requirements: requirements.txt
  log_dir: logs

runtime:
  distribution_mode: frozen_folder
  app_env: null
  required_runtime: null
  requirements_lock: requirements.lock

build:
  managed_by: toolhub_app_studio
  build_mode: frozen-folder
  source_entry: C:\Users\kuroron\Downloads\XCgate_AutoUpload-main\XCgate_AutoUpload-main\run_xcgate_upload.py
  output_mirror: C:\Users\kuroron\Downloads\XCgate_AutoUpload-main\XCgate_AutoUpload-main\ToolHub_AppStudio_Output\run_xcgate_upload

quality:
  approval_required: true
  execution_test_required: true
