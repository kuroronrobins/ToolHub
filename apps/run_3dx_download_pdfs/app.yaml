detail:
  description: >
    COMPASS上で3DXの文書に対してPDFの一括ダウンロードを行うためのアプリです。手作業での繰り返し操作を減らし、対象文書の取得作業を効率化します。
  use_cases:
    - "3DXの文書PDFをまとめて取得する"
    - "手作業のダウンロード作業を減らす"
    - "文書配布前のPDF収集を効率化する"
  inputs:
    - "対象の3DX文書情報"
    - "実行用の設定情報"
    - "ブラウザ操作に必要な利用者操作"
  outputs:
    - "ダウンロードしたPDFファイル"
    - "実行ログ"
    - "処理結果の状態"
  notes:
    - "利用前に対象とする文書範囲を確認してください。"
    - "画面操作を伴うため、実行中はブラウザの状態に注意してください。"
    - "機密情報の入力や共有は行わないでください。"

search:
  keywords:
    - 3DX
    - COMPASS
    - PDF
    - "一括ダウンロード"
    - "文書"
    - "取得"
    - "業務自動化"
  examples:
    - "3DXの文書PDFをまとめて取得するために実行する。"
    - "配布前の文書確認用PDFを一括で集める。"

