id: app_20260201_agendasnap
name: 20260201 AgendaSnap

display:
  icon: icon.png
  icon_fallback: icon.svg
  short_description: "会議音声を録音し、文字起こしと議事録作成を支援するWindows向けアプリです。"
  primary_category: "業務自動化"
