detail:
  description: >
    このアプリは、Windows上で会議音声を扱い、リアルタイムの文字起こし、字幕表示、議事録生成を支援するアプリです。音声入力と連携しながら、会議内容の記録と整理を行う用途を想定しています。
  use_cases:
    - "会議の音声を記録して後から見返せるようにする"
    - "文字起こし結果をもとに議事録を作成する"
    - "会議中の発言を字幕として確認する"
  inputs:
    - "会議音声"
    - "マイク入力"
    - "文字起こし用の設定情報"
  outputs:
    - "文字起こしテキスト"
    - "字幕表示"
    - "議事録"
  notes:
    - "音声認識や議事録生成の設定は実行環境に依存します。"
    - "機密性の高い会議では、保存先や共有範囲に注意してください。"

search:
  keywords:
    - AgendaSnap
    - "会議"
    - "録音"
    - "文字起こし"
    - "字幕"
    - "議事録"
    - Windows
    - "音声認識"
  examples:
    - "定例会議の音声を文字起こしして議事録を作成する"
    - "会議中の発言をリアルタイム字幕で確認する"

