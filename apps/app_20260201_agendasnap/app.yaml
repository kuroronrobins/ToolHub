id: app_20260201_agendasnap
name: AgendaSnap

display:
  icon: icon.svg
  icon_fallback: icon.svg
  short_description: "会議録音、リアルタイム文字起こし、多言語通訳、日本語議事録を一つのアプリで扱います。"
  primary_category: "productivity"
  target_categories:
    - "productivity"
    - "meeting"
  tags:
    - "meeting"
    - "transcription"
    - "minutes"
  categories:
    - "productivity"
    - "meeting"

detail:
  description: >
    監査済みのAgendaSnap v3 Windows配布物をToolHubから起動します。
    Node、ブラウザ、開発サーバー、共有Python環境は必要ありません。
  use_cases:
    - "会議の録音、ライブ字幕、多言語通訳を開始する"
    - "正式文字起こしから日本語の議事録とWordを作成する"
  inputs:
    - "ToolHubの起動操作"
  outputs:
    - "AgendaSnap v3デスクトップアプリ"
  notes:
    - "API認証情報と会議データは配布物に含めません。"

search:
  keywords:
    - "AgendaSnap"
    - "meeting"
    - "transcription"
    - "minutes"
    - "ToolHub"
  examples:
    - "AgendaSnapを起動"

run:
  runner: exe
  entry: bin/AgendaSnap/AgendaSnap.exe
  mode: gui

admin:
  version: 0.1.1
  owner: admin
  log_dir: logs

runtime:
  distribution_mode: frozen_folder
  required_runtime: self-contained:windows-x64
  requirements_lock: requirements.lock

quality:
  approval_required: true
  execution_test_required: true
