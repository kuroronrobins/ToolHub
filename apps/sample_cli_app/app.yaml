id: sample_cli_app
name: CLIサンプルアプリ

display:
  icon: icon.svg
  short_description: 数秒で完了する処理イベントのデモです。
  categories:
    - 業務デモ
    - バッチ処理

detail:
  description: >
    標準出力に進捗イベントを出し、ToolHubの起動状態、完了表示、ログ保存を確認するためのサンプルです。
  use_cases:
    - バッチ処理の起動確認をしたい
    - 進捗イベントの形式を確認したい
  inputs:
    - なし
  outputs:
    - 実行ログ
  notes:
    - 処理は数秒で終了します。

search:
  keywords:
    - CLI
    - バッチ
    - 進捗
    - ログ
  examples:
    - バッチを実行したい
    - 処理イベントを確認したい

run:
  runner: cli
  entry: main.py
  mode: cli

admin:
  version: 1.0.0
  owner: admin
  requirements: requirements.txt
  log_dir: logs

