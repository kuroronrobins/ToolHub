[package]
name = "toolhub"
version = "0.1.0"
description = "ToolHub desktop launcher"
authors = ["ToolHub"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "=2.10.1", features = [] }
