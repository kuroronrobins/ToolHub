id: test11
name: Test12

display:
  icon: icon.png
  icon_fallback: icon.svg
  short_description: "ToolHubの登録動作を確認するためのテストアプリです。"
  categories:
    - "開発支援"
    - "検証"

detail:
  description: >
    このアプリは、ToolHubへの登録、メタデータ反映、起動確認の流れを検証するための最小構成の確認用アプリです。
  use_cases:
    - "ToolHubの登録フロー確認"
    - "メタデータ反映の確認"
    - "起動確認の検証"
  inputs:
    - "コマンドライン引数"
  outputs:
    - "標準出力"
  notes:
    - "正式運用の前に動作確認を行ってください。"

search:
  keywords:
    - "テスト"
    - "動作確認"
    - ToolHub
    - "登録確認"
    - "検証"
  examples:
    - "ToolHubへの登録動作を確認する"
    - "起動できるかを確認する"

run:
  runner: python_app_env
  entry: src/main.py
  mode: gui

