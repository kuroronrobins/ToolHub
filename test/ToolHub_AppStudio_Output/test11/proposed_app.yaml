  owner: admin
  requirements: requirements.txt
  log_dir: logs

runtime:
  distribution_mode: app_env
  app_env: test11
  required_runtime: python-embedded-toolhub-001
  requirements_lock: requirements.lock

build:
  managed_by: toolhub_app_studio
  build_mode: app-env
  source_entry: C:\Users\kuroron\Documents\RD\20260426_Toolhub\test\main.py
  output_mirror: C:\Users\kuroron\Documents\RD\20260426_Toolhub\test\ToolHub_AppStudio_Output\test11

